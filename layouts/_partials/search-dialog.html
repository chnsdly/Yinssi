{{ $hasPosts := gt (len (partialCached "posts.html" site)) 0 }}
<dialog id="site-search" class="search-dialog" aria-label="搜索">
  <div class="search-input-row">
    <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <label class="visually-hidden" for="site-search-input">搜索文章标题或正文</label>
    <input id="site-search-input" type="search" placeholder="搜索…" autocomplete="off" enterkeyhint="search" autofocus{{ if not $hasPosts }} disabled{{ end }}>
    <button type="button" class="search-clear" aria-label="清空搜索词" hidden>×</button>
    <button type="button" class="search-close" aria-label="关闭搜索">关闭</button>
  </div>
  <div class="search-results-scroll"{{ if $hasPosts }} hidden{{ end }}>
    <p class="search-status" role="status" aria-live="polite">{{ if not $hasPosts }}暂无已发布文章。{{ end }}</p>
    <ul class="search-result-list" aria-label="搜索结果"></ul>
    <button class="search-more" type="button" hidden>显示更多</button>
  </div>
</dialog>
